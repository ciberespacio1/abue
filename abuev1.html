
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--btn-radius:18px;--shadow:0 4px 14px rgba(0,0,0,0.10);--shadow-sm:0 1px 4px rgba(0,0,0,0.08);}
  #aac{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#eaebff 0%,#f5f0ff 50%,#ffe8f4 100%);border-radius:24px;padding:16px;position:relative;overflow:hidden;}
  .aac-header{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;}
  .aac-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid white;box-shadow:0 2px 10px rgba(61,44,141,0.2);flex-shrink:0;}
  .aac-header-text{text-align:left;}
  .aac-title{font-family:'Baloo 2',cursive;font-size:20px;font-weight:800;color:#3d2c8d;line-height:1.1;}
  .aac-sub{font-size:11px;color:#6b7280;}
  .section-label{font-size:10px;font-weight:800;color:#9ca3af;letter-spacing:1px;text-transform:uppercase;margin:10px 0 6px;}
  .grid-needs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:4px;}
  .need-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 4px;border-radius:var(--btn-radius);border:none;cursor:pointer;background:white;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;min-height:84px;user-select:none;-webkit-tap-highlight-color:transparent;}
  .need-btn:active,.need-btn.activated{transform:scale(0.93);box-shadow:var(--shadow-sm);}
  .need-btn.playing::after{content:'';position:absolute;inset:0;border-radius:var(--btn-radius);border:3px solid rgba(108,71,232,0.6);animation:ring-out .5s ease-out forwards;}
  @keyframes ring-out{0%{opacity:1;transform:scale(0.95);}100%{opacity:0;transform:scale(1.06);}}
  .btn-icon{font-size:30px;line-height:1;}
  .btn-label{font-size:10px;font-weight:700;color:#1a1a2e;text-align:center;line-height:1.2;}
  .bottom-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px;}
  .emergency-btn{background:linear-gradient(135deg,#ff3b30,#c0000a);color:white;border:none;border-radius:var(--btn-radius);padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 18px rgba(255,59,48,0.4);transition:transform .12s;font-family:'Nunito',sans-serif;user-select:none;}
  .emergency-btn:active{transform:scale(0.95);}
  .emergency-btn.ringing{animation:epulse .4s infinite alternate;}
  @keyframes epulse{0%{box-shadow:0 4px 18px rgba(255,59,48,0.4);}100%{box-shadow:0 4px 40px rgba(255,59,48,0.9),0 0 0 8px rgba(255,59,48,0.2);}}
  .gracias-btn{background:linear-gradient(135deg,#f59e0b,#f97316);color:white;border:none;border-radius:var(--btn-radius);padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 18px rgba(249,115,22,0.35);transition:transform .12s;font-family:'Nunito',sans-serif;user-select:none;}
  .gracias-btn:active{transform:scale(0.95);}
  .gracias-btn.sparkling{animation:sparkle .5s ease-out;}
  @keyframes sparkle{0%{transform:scale(0.92);}40%{transform:scale(1.08);}70%{transform:scale(0.97);}100%{transform:scale(1);}}
  .msg-btn{background:linear-gradient(135deg,#3d2c8d,#6c47e8);color:white;border:none;border-radius:var(--btn-radius);padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 18px rgba(61,44,141,0.3);transition:transform .12s;font-family:'Nunito',sans-serif;user-select:none;}
  .msg-btn:active{transform:scale(0.95);}
  .bicon{font-size:22px;}
  .btext strong{display:block;font-size:12px;font-weight:800;}
  .btext span{font-size:10px;opacity:.85;}
  .react-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:4px;}
  .react-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border-radius:16px;border:2.5px solid transparent;cursor:pointer;background:white;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;min-height:72px;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Nunito',sans-serif;}
  .react-btn:active{transform:scale(0.91);}
  .react-btn.r-no{border-color:#fca5a5;}
  .react-btn.r-si{border-color:#86efac;}
  .react-btn.r-risa{border-color:#fde68a;}
  .react-btn.r-enojo{border-color:#f97316;}
  .react-btn.r-ignoro{border-color:#d1d5db;}
  .react-btn.flash{animation:flash-btn .35s ease-out;}
  @keyframes flash-btn{0%{transform:scale(0.88);}60%{transform:scale(1.07);}100%{transform:scale(1);}}
  .react-icon{font-size:28px;line-height:1;}
  .react-label{font-size:10px;font-weight:800;text-align:center;}
  .r-no .react-label{color:#dc2626;}
  .r-si .react-label{color:#16a34a;}
  .r-risa .react-label{color:#ca8a04;}
  .r-enojo .react-label{color:#ea580c;}
  .r-ignoro .react-label{color:#6b7280;}
  .status-bar{margin-top:10px;background:white;border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm);min-height:38px;}
  .sdot{width:9px;height:9px;border-radius:50%;background:#d1d5db;flex-shrink:0;transition:background .3s;}
  .sdot.active{background:#22c55e;animation:blink 1s infinite;}
  .sdot.emergency{background:#ef4444;animation:blink .3s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  .stext{font-size:12px;color:#6b7280;flex:1;font-weight:600;}
  .stext.spoken{color:#3d2c8d;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal-box{background:white;border-radius:22px;padding:22px;width:320px;max-width:90vw;transform:translateY(20px);transition:transform .25s;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
  .modal-overlay.open .modal-box{transform:translateY(0);}
  .modal-title{font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;color:#3d2c8d;text-align:center;margin-bottom:4px;}
  .modal-sub{font-size:11px;color:#6b7280;text-align:center;margin-bottom:13px;}
  .modal-textarea{width:100%;border:2px solid #e5e7eb;border-radius:12px;padding:10px;font-family:'Nunito',sans-serif;font-size:14px;resize:none;height:90px;outline:none;transition:border-color .2s;color:#1a1a2e;}
  .modal-textarea:focus{border-color:#6c47e8;}
  .modal-actions{display:flex;gap:8px;margin-top:12px;}
  .modal-cancel{flex:1;padding:10px;border-radius:12px;border:2px solid #e5e7eb;background:white;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:#6b7280;cursor:pointer;}
  .modal-speak{flex:2;padding:10px;border-radius:12px;border:none;background:linear-gradient(135deg,#3d2c8d,#6c47e8);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .mic-btn{width:100%;padding:9px;border-radius:12px;border:2px dashed #c4b5fd;background:#f5f0ff;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:#6c47e8;cursor:pointer;margin-top:9px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s;}
  .mic-btn.recording{background:#fef2f2;border-color:#fca5a5;color:#ef4444;animation:micpulse .8s infinite;}
  @keyframes micpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.02);}}
</style>

<div id="aac" role="main">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Tablero de comunicación aumentativa y alternativa</h2>

  <div class="aac-header">
    <img id="avatarImg" class="aac-avatar" src="abuef.png" alt="Foto de perfil" />
    <div class="aac-header-text">
      <div class="aac-title">💬 Mi Tablero de Comunicación</div>
      <div class="aac-sub">Toca un botón · Abue</div>
    </div>
  </div>

  <div class="section-label">🙋 Mis necesidades</div>
  <div class="grid-needs">
    <button class="need-btn" onclick="say(this,'Necesito comer, por favor ayúdame.','🍽️ Comer')"><span class="btn-icon">🍽️</span><span class="btn-label">Comer</span></button>
    <button class="need-btn" onclick="say(this,'Necesito ir al baño, por favor ayúdame.','🚻 Baño')"><span class="btn-icon">🚻</span><span class="btn-label">Ir al baño</span></button>
    <button class="need-btn" onclick="say(this,'Tengo sueño, quiero descansar y dormir.','😴 Dormir')"><span class="btn-icon">😴</span><span class="btn-label">Dormir</span></button>
    <button class="need-btn" onclick="say(this,'Quiero bañarme, y si es en el COY, mejor. Necesito ayuda por favor.','🛁 Bañarse')"><span class="btn-icon">🛁</span><span class="btn-label">Bañarse</span></button>
    <button class="need-btn" onclick="say(this,'Me gustaría salir a pasear un poco, por favor. Si es al rancho, mejor','🌳 Pasear')"><span class="btn-icon">🌳</span><span class="btn-label">Pasear</span></button>
  </div>
  <div class="grid-needs">
    <button class="need-btn" onclick="say(this,'Quiero ver televisión, por favor ponla, Toñis.','📺 Ver TV')"><span class="btn-icon">📺</span><span class="btn-label">Ver TV</span></button>
    <button class="need-btn" onclick="say(this,'Necesito cambiarme de ropa, ayúdame por favor.','👗 Ropa')"><span class="btn-icon">👗</span><span class="btn-label">Cambiar ropa</span></button>
    <button class="need-btn" onclick="say(this,'Tengo sed, quiero agua por favor.','💧 Agua')"><span class="btn-icon">💧</span><span class="btn-label">Agua</span></button>
    <button class="need-btn" onclick="say(this,'Quiero comer fruta por favor.','🍎 Fruta')"><span class="btn-icon">🍎</span><span class="btn-label">Fruta</span></button>
    <button class="need-btn" onclick="say(this,'Es hora de mis medicinas, por favor ayúdame.','💊 Medicinas')"><span class="btn-icon">💊</span><span class="btn-label">Medicinas</span></button>
  </div>

  <div class="section-label">😊 Mis reacciones</div>
  <div class="react-row">
    <button class="react-btn r-no" onclick="react(this,'No.','❌ NO')"><span class="react-icon">❌</span><span class="react-label">NO</span></button>
    <button class="react-btn r-si" onclick="react(this,'Sí.','✅ SÍ')"><span class="react-icon">✅</span><span class="react-label">SÍ</span></button>
    <button class="react-btn r-risa" onclick="react(this,'¡Jajaja! ¡Qué gracioso! ¡Me da mucha risa!','😂 Risa')"><span class="react-icon">😂</span><span class="react-label">Risa</span></button>
    <button class="react-btn r-enojo" onclick="react(this,'Estoy enojada. No me gusta esto.','😠 Enojo')"><span class="react-icon">😠</span><span class="react-label">Enojo</span></button>
    <button class="react-btn r-ignoro" onclick="react(this,'Lo ignoro. No lo sé.','🙄 Lo ignoro')"><span class="react-icon">🙄</span><span class="react-label">Lo ignoro</span></button>
  </div>

  <div class="section-label">⚡ Acciones rápidas</div>
  <div class="bottom-row">
    <button class="emergency-btn" id="emergencyBtn" onclick="triggerEmergency()">
      <span class="bicon">🚨</span>
      <div class="btext"><strong>¡EMERGENCIA!</strong><span>Llamar ayuda</span></div>
    </button>
    <button class="gracias-btn" id="graciasBtn" onclick="sayGracias()">
      <span class="bicon">🙏</span>
      <div class="btext"><strong>¡Gracias!</strong><span>Con cariño</span></div>
    </button>
    <button class="msg-btn" onclick="openModal()">
      <span class="bicon">✍️</span>
      <div class="btext"><strong>Mi mensaje</strong><span>Escribe y escucha</span></div>
    </button>
  </div>

  <div class="status-bar">
    <div class="sdot" id="sdot"></div>
    <div class="stext" id="stext">Lista para comunicarme — toca cualquier botón</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-title">✍️ Escribe tu mensaje</div>
    <div class="modal-sub">Se leerá en voz al presionar Hablar</div>
    <textarea class="modal-textarea" id="msgInput" placeholder="Escribe aquí lo que quieres decir..." maxlength="300"></textarea>
    <!-- <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤 Dictar por micrófono</button> -->
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-speak" onclick="speakCustom()">🔊 Hablar</button>
    </div>
  </div>
</div>

<script>
(function(){
  var img=document.getElementById('avatarImg');
  fetch('/mnt/user-data/uploads/abuef.png').then(function(r){return r.blob();}).then(function(b){
    img.src=URL.createObjectURL(b);
  }).catch(function(){});
})();

var synth=window.speechSynthesis;
var recognition=null,isRecording=false,emergencyInterval=null,emergencyActive=false;

function getFemaleVoice(){
  var voices=synth.getVoices();
  var order=[
    function(v){return v.lang==='es-MX'&&/female|mujer|femenin/i.test(v.name);},
    function(v){return v.lang==='es-MX'&&/paulina|sabina|mónica|monica|sofia|luciana|valeria|gabriela|carmen|maria|laura|ana|rosa|elena/i.test(v.name);},
    function(v){return v.lang==='es-MX';},
    function(v){return v.lang.startsWith('es')&&/female|mujer|femenin/i.test(v.name);},
    function(v){return v.lang.startsWith('es');}
  ];
  for(var i=0;i<order.length;i++){var f=voices.filter(order[i]);if(f.length)return f[0];}
  return null;
}

function chime(type){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var sets={happy:[523,659,784],sad:[392,330,262],thanks:[523,659,784,1047]};
    var notes=sets[type]||sets.happy;
    notes.forEach(function(f,i){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type= type==='thanks'?'triangle':'sine';
      o.frequency.value=f;
      g.gain.setValueAtTime(0.22,ctx.currentTime+i*0.12);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.12+0.25);
      o.start(ctx.currentTime+i*0.12);
      o.stop(ctx.currentTime+i*0.12+0.25);
    });
  }catch(e){}
}

function alarmSound(){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(function(t){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sawtooth';o.frequency.value=880;
      g.gain.setValueAtTime(0.35,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.2);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.2);
    });
  }catch(e){}
}

function setStatus(txt,type){
  var d=document.getElementById('sdot'),t=document.getElementById('stext');
  t.textContent=txt;t.className='stext'+(type?' '+type:'');
  d.className='sdot'+(type?' '+type:'');
}

function makeSpeech(msg,rate,pitch){
  rate=rate||0.88;pitch=pitch||1.1;
  var utt=new SpeechSynthesisUtterance(msg);
  utt.lang='es-MX';utt.rate=rate;utt.pitch=pitch;
  var v=getFemaleVoice();if(v)utt.voice=v;
  return utt;
}

function say(btn,msg,label){
  synth.cancel();chime('happy');
  document.querySelectorAll('.need-btn').forEach(function(b){b.classList.remove('activated','playing');});
  btn.classList.add('activated','playing');
  setStatus('🔊 Diciendo: '+label,'active');
  setTimeout(function(){
    var utt=makeSpeech(msg);
    utt.onend=function(){
      btn.classList.remove('playing');
      setStatus('✅ Mensaje enviado: '+label,'spoken');
      setTimeout(function(){setStatus('Lista para comunicarme — toca cualquier botón','');btn.classList.remove('activated');},3000);
    };
    synth.speak(utt);
  },450);
}

function sayGracias(){
  synth.cancel();
  chime('thanks');
  var btn=document.getElementById('graciasBtn');
  btn.classList.add('sparkling');
  btn.addEventListener('animationend',function(){btn.classList.remove('sparkling');},{once:true});
  setStatus('🙏 Diciendo: ¡Muchas gracias!','active');
  setTimeout(function(){
    var utt=makeSpeech('¡Muchas gracias! ',0.85,1.15);
    utt.onend=function(){
      setStatus('💛 ¡Gracias enviado con cariño!','spoken');
      setTimeout(function(){setStatus('Lista para comunicarme — toca cualquier botón','');},3500);
    };
    synth.speak(utt);
  },500);
}

function react(btn,msg,label){
  synth.cancel();
  chime(label.indexOf('NO')<0&&label.indexOf('Enojo')<0&&label.indexOf('ignoro')<0?'happy':'sad');
  btn.classList.add('flash');
  btn.addEventListener('animationend',function(){btn.classList.remove('flash');},{once:true});
  setStatus('🔊 '+label,'active');
  var utt=makeSpeech(msg,0.92,1.05);
  utt.onend=function(){
    setStatus('✅ Reacción: '+label,'spoken');
    setTimeout(function(){setStatus('Lista para comunicarme — toca cualquier botón','');},3000);
  };
  synth.speak(utt);
}

function triggerEmergency(){
  var btn=document.getElementById('emergencyBtn');
  if(emergencyActive){stopEmergency();return;}
  emergencyActive=true;btn.classList.add('ringing');
  btn.innerHTML='<span class="bicon">🛑</span><div class="btext"><strong>DETENER</strong><span>Toca para cancelar</span></div>';
  setStatus('🚨 EMERGENCIA ACTIVADA — ¡Necesito ayuda urgente!','emergency');
  function doAlarm(){alarmSound();synth.cancel();synth.speak(makeSpeech('Emergencia. Necesito ayuda urgente. Por favor vengan.',1.1,1.3));}
  doAlarm();emergencyInterval=setInterval(doAlarm,5000);
}

function stopEmergency(){
  emergencyActive=false;clearInterval(emergencyInterval);synth.cancel();
  var btn=document.getElementById('emergencyBtn');
  btn.classList.remove('ringing');
  btn.innerHTML='<span class="bicon">🚨</span><div class="btext"><strong>¡EMERGENCIA!</strong><span>Llamar ayuda</span></div>';
  setStatus('Emergencia cancelada — Lista para comunicarme','');
}

function openModal(){document.getElementById('modalOverlay').classList.add('open');setTimeout(function(){document.getElementById('msgInput').focus();},300);}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');if(isRecording)stopMic();document.getElementById('msgInput').value='';}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

function speakCustom(){
  var msg=document.getElementById('msgInput').value.trim();
  if(!msg)return;
  synth.cancel();closeModal();chime('happy');
  setStatus('🔊 Diciendo tu mensaje...','active');
  setTimeout(function(){
    var utt=makeSpeech(msg);
    utt.onend=function(){setStatus('✅ Mensaje personalizado enviado','spoken');setTimeout(function(){setStatus('Lista para comunicarme — toca cualquier botón','');},4000);};
    synth.speak(utt);
  },450);
}

function toggleMic(){
  if(isRecording){stopMic();return;}
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){document.getElementById('msgInput').placeholder='Dictado no disponible. Escribe tu mensaje.';return;}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang='es-MX';recognition.continuous=false;recognition.interimResults=true;
  recognition.onstart=function(){isRecording=true;var m=document.getElementById('micBtn');m.classList.add('recording');m.textContent='🔴 Grabando... (toca para detener)';};
  recognition.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;document.getElementById('msgInput').value=t;};
  recognition.onend=function(){stopMic();};recognition.onerror=function(){stopMic();};
  recognition.start();
}

function stopMic(){
  isRecording=false;if(recognition){try{recognition.stop();}catch(e){}recognition=null;}
  var m=document.getElementById('micBtn');m.classList.remove('recording');m.innerHTML='🎤 Dictar por micrófono';
}

if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=function(){getFemaleVoice();};
setTimeout(function(){getFemaleVoice();},500);
</script>
